<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diário de Estudos | Cadastro</title>
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-header">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3.5 6.5C3.5 5.67 4.17 5 5 5h6c1.05 0 2.07.37 2.88 1.03L15 7v11l-.76-.61A4.6 4.6 0 0 0 11.38 16H5a1.5 1.5 0 0 1-1.5-1.5v-8Z" stroke="currentColor" stroke-width="1.8"/><path d="M20.5 6.5c0-.83-.67-1.5-1.5-1.5h-6c-1.05 0-2.07.37-2.88 1.03L9 7v11l.76-.61A4.6 4.6 0 0 1 12.62 16H19a1.5 1.5 0 0 0 1.5-1.5v-8Z" stroke="currentColor" stroke-width="1.8"/></svg>
      </div>
      <h1>Diário de Estudos</h1>
      <p>Crie sua conta para começar</p>
    </section>

    <section class="auth-card">
      <form id="cadastro-form" class="form-stack">
        <div>
          <label for="name">Nome</label>
          <input id="name" type="text" required />
        </div>
        <div>
          <label for="role">Perfil</label>
          <select id="role" required>
            <option value="estudante">Estudante</option>
            <option value="professor">Professor</option>
          </select>
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" required />
        </div>
        <div>
          <label for="password">Senha</label>
          <input id="password" type="password" required />
        </div>
        <button class="btn-primary" type="submit">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2"/></svg>
          Cadastrar
        </button>
      </form>
      <p class="auth-switch">Já tem conta? <a href="./login.html">Entre aqui</a></p>
    </section>
  </main>

  <div id="toast-root"></div>

  <script src="./assets/js/storage.js"></script>
  <script src="./assets/js/auth.js"></script>
  <script src="./assets/js/guards.js"></script>
  <script src="./assets/js/ui.js"></script>
  <script src="./assets/js/cadastro.js"></script>
</body>
</html>
