<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Sistema Fametro</title>
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>

<body>
  <div class="top-stripe"></div>

  <main class="container app-shell">
    <header class="site-header">
      <h1>Acesso ao Sistema</h1>
      <p class="site-subtitle">Faça login para continuar</p>
    </header>

    <nav class="app-nav" aria-label="Navegação principal">
      <div class="nav-left"></div>
      <div class="nav-right">
        <button class="btn btn--nav" type="button" id="dark-mode-toggle">
          <span class="mode-text">Modo</span>
          <span class="mode-icon">🌙</span>
        </button>
      </div>
    </nav>

    <!-- Área de login/registro -->
    <div class="links-controls" style="max-width: 450px; margin: 0 auto; min-height: 380px;">
      <!-- Formulário de Login -->
      <form id="login-form">
        <h2>Entrar</h2>
        <div class="field">
          <span>E-mail</span>
          <input type="email" id="email" class="search-input" required>
        </div>
        <div class="field">
          <span>Senha</span>
          <input type="password" id="password" class="search-input" required>
        </div>
        <button type="submit" class="btn btn--accent btn--block">Entrar</button>

        <!-- Link esqueci minha senha (centralizado) -->
        <div style="text-align: center; margin-top: 0.5rem;">
          <a href="#" id="forgot-password">Esqueci minha senha</a>
        </div>

        <!-- Link para registrar (aparece apenas no login) -->
        <p style="margin-top:1rem; text-align:center;">
          Não tem conta? <a href="#" id="show-register">Registrar</a>
        </p>
      </form>

      <!-- Formulário de Registro -->
      <form id="register-form" style="display:none; margin-top:1rem;">
        <h3>Registrar</h3>
        <div class="field">
          <span>Nome</span>
          <input type="text" id="reg-nome" class="search-input" required>
        </div>
        <div class="field">
          <span>E-mail</span>
          <input type="email" id="reg-email" class="search-input" required>
        </div>
        <div class="field">
          <span>Senha</span>
          <input type="password" id="reg-password" class="search-input" required>
        </div>
        <div class="field">
          <span>Confirmar Senha</span>
          <input type="password" id="reg-confirm-password" class="search-input" required>
        </div>
        <button type="submit" class="btn btn--accent btn--block">Registrar</button>
        <p style="margin-top:0.5rem; text-align:center;">
          <a href="#" id="show-login">Voltar para login</a>
        </p>
      </form>

      <!-- Mensagem de erro/sucesso -->
      <div id="login-message"></div>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 Nawk &amp; Bentes – Todos os direitos reservados</p>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
  <script>
    // CONFIGURAÇÕES DO FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyBqKuf4gC-UCzhrQu3samKeZxVK7kN9Ym4",
      authDomain: "portal-inscricoes-tickets.firebaseapp.com",
      projectId: "portal-inscricoes-tickets",
      storageBucket: "portal-inscricoes-tickets.firebasestorage.app",
      messagingSenderId: "364717584125",
      appId: "1:364717584125:web:d7099acf6391325c7cd894",
      measurementId: "G-DW1WGEE9FS"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .then(() => console.log('Persistência LOCAL definida'))
      .catch(error => console.error('Erro na persistência:', error));

    // Flag para controle de redirecionamento
    let isRedirecting = false;

    auth.onAuthStateChanged(user => {
      if (user && !isRedirecting) {
        console.log('Usuário já logado, redirecionando para portal.html');
        window.location.href = './portal.html';
      }
    });

    // Elementos do DOM
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const showRegister = document.getElementById('show-register');
    const showLogin = document.getElementById('show-login');
    const forgotPasswordLink = document.getElementById('forgot-password');
    const messageDiv = document.getElementById('login-message');

    // Função para exibir mensagens
    function showMessage(text, isSuccess = false) {
      messageDiv.textContent = text;
      messageDiv.style.display = 'flex';
      messageDiv.style.backgroundColor = isSuccess ? '#d4edda' : '#f8d7da';
      messageDiv.style.color = isSuccess ? '#155724' : '#721c24';
      messageDiv.style.border = isSuccess ? '1px solid #c3e6cb' : '1px solid #f5c6cb';
    }

    // Tradução de erros do Firebase
    function traduzirErroFirebase(errorCode) {
      const erros = {
        'auth/invalid-email': 'E-mail inválido.',
        'auth/user-disabled': 'Esta conta foi desativada.',
        'auth/user-not-found': 'Usuário não encontrado.',
        'auth/wrong-password': 'Senha incorreta.',
        'auth/invalid-login-credentials': 'E-mail ou senha incorretos.',
        'auth/email-already-in-use': 'Este e-mail já está em uso.',
        'auth/weak-password': 'Senha muito curta (mínimo 6 caracteres).',
        'auth/network-request-failed': 'Verifique sua internet.',
        'auth/too-many-requests': 'Muitas tentativas. Tente mais tarde.',
        'auth/popup-closed-by-user': 'Login cancelado.',
        'auth/cancelled-popup-request': 'Operação cancelada.',
        'auth/internal-error': 'Erro interno. Tente novamente.'
      };
      return erros[errorCode] || `Erro desconhecido: ${errorCode}`;
    }

    // Alternar para registro
    showRegister.addEventListener('click', (e) => {
      e.preventDefault();
      loginForm.style.display = 'none';
      registerForm.style.display = 'block';
      messageDiv.style.display = 'none';
    });

    // Alternar para login
    showLogin.addEventListener('click', (e) => {
      e.preventDefault();
      registerForm.style.display = 'none';
      loginForm.style.display = 'block';
      messageDiv.style.display = 'none';
    });

    // Esqueci minha senha
    forgotPasswordLink.addEventListener('click', async (e) => {
      e.preventDefault();
      const email = prompt('Digite seu e-mail para recuperar a senha:');
      if (!email) return;

      try {
        await auth.sendPasswordResetEmail(email);
        showMessage('E-mail de recuperação enviado! Verifique sua caixa de entrada.', true);
      } catch (error) {
        showMessage(traduzirErroFirebase(error.code));
      }
    });

    // Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      messageDiv.style.display = 'none';

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (error) {
        showMessage(traduzirErroFirebase(error.code));
      }
    });

    // Registro
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nome = document.getElementById('reg-nome').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;

      // Validações
      if (password !== confirmPassword) {
        showMessage('As senhas não coincidem.');
        return;
      }
      if (nome === '') {
        showMessage('Por favor, informe seu nome.');
        return;
      }

      messageDiv.style.display = 'none';
      isRedirecting = true;

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);

        // Gerar id_operador auto-incrementado via transação
        const contadorRef = db.collection('counters').doc('id_operador');
        const novoIdOperador = await db.runTransaction(async (transaction) => {
          const contadorDoc = await transaction.get(contadorRef);
          let proximoId = 1;
          if (contadorDoc.exists) {
            proximoId = (contadorDoc.data().current || 0) + 1;
          }
          transaction.set(contadorRef, { current: proximoId });
          return proximoId;
        });

        // Salvar no Firestore com id_operador
        await db.collection('users').doc(cred.user.uid).set({
          id_operador: novoIdOperador,
          nome: nome,
          email: email,
          tipo: 'comum',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // Atualizar displayName
        await cred.user.updateProfile({ displayName: nome });

        // Salvar na aba OPERADORES do Google Sheets (via API backend)
        const apiUrl = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:') ? 'http://localhost:3000' : 'https://portal-inscricoes.onrender.com';
        fetch(`${apiUrl}/operadores`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: novoIdOperador,
            uid: cred.user.uid,
            nome: nome,
            email: email,
            tipo: 'comum'
          })
        }).catch(err => console.warn('Aviso: não salvou no Sheets:', err));

        console.log('Registro concluído. Nome salvo:', nome);
        window.location.href = './portal.html';
      } catch (error) {
        console.log('Erro no registro:', error.code);
        showMessage(traduzirErroFirebase(error.code));
        isRedirecting = false;
      }
    });

    // Logout (para uso em outras páginas)
    window.logout = () => {
      auth.signOut().then(() => {
        window.location.href = './index.html';
      });
    };
  </script>
  <script src="./assets/js/dark-mode.js"></script>
  <script src="./assets/js/notificacoes.js"></script>
</body>

</html>
