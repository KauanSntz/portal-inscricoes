  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBqKuf4gC-UCzhrQu3samKeZxVK7kN9Ym4",
      authDomain: "portal-inscricoes-tickets.firebaseapp.com",
      projectId: "portal-inscricoes-tickets",
      storageBucket: "portal-inscricoes-tickets.firebasestorage.app",
      messagingSenderId: "364717584125",
      appId: "1:364717584125:web:d7099acf6391325c7cd894",
      measurementId: "G-DW1WGEE9FS"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .then(() => console.log('✅ Persistência LOCAL definida em portal'))
      .catch(error => console.error('❌ Erro na persistência:', error));

    let currentUser = null;

    auth.onAuthStateChanged(async (user) => {
      console.log('🔍 portal: onAuthStateChanged', user ? `Usuário: ${user.email}` : 'Nenhum usuário');
      if (!user) {
        window.location.href = './index.html';
        return;
      }

      try {
        const doc = await db.collection('users').doc(user.uid).get();
        if (doc.exists) {
          currentUser = { uid: user.uid, ...doc.data() };
        } else {
          const newUser = {
            email: user.email,
            nome: user.displayName || 'Usuário',
            tipo: 'comum',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          };
          await db.collection('users').doc(user.uid).set(newUser);
          currentUser = { uid: user.uid, ...newUser };
        }
        
        // Sincroniza o tipo com localStorage para telas standalone (ex: admin-links.html)
        localStorage.setItem('userType', currentUser.tipo);

        // Mostrar links de tickets e logout nos dois menus
        const ticketsLink = document.getElementById('tickets-link');
        const ticketsLinkNav = document.getElementById('tickets-link-nav');
        const logoutBtnNav = document.getElementById('logout-btn-nav');
        const logoutBtnMenu = document.getElementById('logout-btn-menu');
        const adminMenuItem = document.getElementById('admin-menu-item');

        if (ticketsLink) ticketsLink.style.display = 'inline-block';
        if (ticketsLinkNav) ticketsLinkNav.style.display = 'inline-block';
        if (logoutBtnNav) logoutBtnNav.style.display = 'inline-block';
        if (logoutBtnMenu) logoutBtnMenu.style.display = 'inline-block';

        // Menu Admin desabilitado temporariamente

        // Preencher perfil
        const userProfile = document.getElementById('user-profile');
        const userNameSpan = document.getElementById('user-name');
        const userEmailSpan = document.getElementById('user-email');
        if (userProfile && userNameSpan && userEmailSpan) {
          userNameSpan.textContent = currentUser.nome || 'Usuário';
          userEmailSpan.textContent = currentUser.email || '';
          userProfile.style.display = 'flex';
        }

        // Atualizar badges
        atualizarBadges();
      } catch (error) {
        console.error('Erro ao carregar perfil:', error);
        window.location.href = './index.html';
      }
    });

    async function atualizarBadges() {
  if (!currentUser) return;

  const badgeAbertos = document.getElementById('tickets-badge');
  const badgeAndamento = document.getElementById('tickets-andamento-badge');
  const badgeAbertosNav = document.getElementById('tickets-badge-nav');
  const badgeAndamentoNav = document.getElementById('tickets-andamento-badge-nav');

  if (!badgeAbertos || !badgeAndamento || !badgeAbertosNav || !badgeAndamentoNav) {
    console.warn('Elementos de badge não encontrados');
    return;
  }

  let queryAbertos = db.collection('tickets').where('status', '==', 'aberto');
  let queryAndamento = db.collection('tickets').where('status', '==', 'em_andamento');

  if (currentUser.tipo === 'comum') {
    queryAbertos = queryAbertos.where('criadoPor', '==', currentUser.uid);
    queryAndamento = queryAndamento.where('criadoPor', '==', currentUser.uid);
  } else if (currentUser.tipo === 'admin') {
    queryAbertos = queryAbertos.where('superTicket', '==', false);
    queryAndamento = queryAndamento.where('superTicket', '==', false)
                                    .where('iniciadoPor', '==', currentUser.uid);
  } else if (currentUser.tipo === 'super_admin') {
    queryAndamento = queryAndamento.where('iniciadoPor', '==', currentUser.uid);
  }

  try {
    const [snapAbertos, snapAndamento] = await Promise.all([queryAbertos.get(), queryAndamento.get()]);

    badgeAbertos.textContent = snapAbertos.size;
    badgeAbertos.style.display = snapAbertos.size === 0 ? 'none' : 'inline-block';

    badgeAndamento.textContent = snapAndamento.size;
    badgeAndamento.style.display = snapAndamento.size === 0 ? 'none' : 'inline-block';

    badgeAbertosNav.textContent = snapAbertos.size;
    badgeAbertosNav.style.display = snapAbertos.size === 0 ? 'none' : 'inline-block';

    badgeAndamentoNav.textContent = snapAndamento.size;
    badgeAndamentoNav.style.display = snapAndamento.size === 0 ? 'none' : 'inline-block';
  } catch (error) {
    console.error('Erro ao atualizar badges:', error);
  }
}

    window.logout = () => {
      auth.signOut().then(() => {
        window.location.href = './index.html';
      }).catch(error => {
        console.error('Erro no logout:', error);
      });
    };
  </script>
