<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciar Usuários</title>
  <link rel="stylesheet" href="./assets/css/styles.css" />
  <style>
    .user-card {
      padding: 1rem 1.2rem;
      margin-bottom: 0.75rem;
    }
    .user-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .user-nome {
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent);
    }
    .user-email {
      font-size: 0.85rem;
      color: var(--text);
      opacity: 0.7;
      margin-bottom: 0.5rem;
    }
    body.dark-mode .user-nome {
      color: var(--accent);
    }
    body.dark-mode .user-email {
      color: #cbd5e1;
    }
    .user-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 0.75rem;
    }
    .self-tag { font-size: 0.78rem; color: #dc2626; font-weight: 600; }

    /* Toast inline de sucesso/erro */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-md);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      z-index: 9999;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      animation: slideIn 0.25s ease;
    }
    .toast.ok { background: #10b981; }
    .toast.err { background: #ef4444; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .users-search {
      margin-bottom: 1rem;
    }
    .users-count {
      font-size: 0.85rem;
      opacity: 0.7;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>

  <main class="container app-shell">
    <!-- HEADER -->
    <header class="site-header">
      <div class="header-row">
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">☰</button>
        <div>
          <h1>Gerenciar Usuários</h1>
          <p class="site-subtitle">Apenas super administradores</p>
        </div>
      </div>
    </header>

    <!-- MENU LATERAL -->
    <div class="side-menu" id="sideMenu">
      <div class="side-menu-header">
        <button class="menu-close" id="menuClose">✕</button>
      </div>
      <nav class="side-menu-nav">
        <div id="menu-container"></div>
      </nav>
    </div>

    <!-- Overlay -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- NAV SUPERIOR -->
    <div class="nav-quick">
    <div class="nav-left">
      <a class="btn btn--nav" href="./portal.html">Portal</a>
      <a class="btn btn--nav" href="./links.html">Polos</a>
      <a class="btn btn--nav" href="./diario.html">Diário de Bordo</a>
      <a class="btn btn--nav" href="./tickets.html" id="tickets-link-nav" >
        Tickets 
        <span id="tickets-badge-nav" class="badge" style="background-color:#dc2626;">0</span>
        <span id="tickets-andamento-badge-nav" class="badge" style="background-color:#f59e0b; margin-left:0.2rem;">0</span>
      </a>
      <button class="btn btn--nav" id="logout-btn-nav" onclick="logout()" >Sair</button>
    </div>
    <div class="nav-right">
      <button class="btn btn--nav" type="button" id="dark-mode-toggle">
        <span class="mode-text">Modo</span>
        <span class="mode-icon">🌙</span>
      </button>
    </div>
  </div>

    <!-- Controles -->
    <div class="links-controls">
      <input type="search" id="busca-usuarios" class="search-input users-search" placeholder="Buscar por nome ou e-mail..." />
      <p class="users-count" id="users-count"></p>

    <!-- Lista de usuários -->

    <div id="users-empty" class="empty" hidden>Nenhum usuário encontrado.</div>

  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBqKuf4gC-UCzhrQu3samKeZxVK7kN9Ym4",
      authDomain: "portal-inscricoes-tickets.firebaseapp.com",
      projectId: "portal-inscricoes-tickets",
      storageBucket: "portal-inscricoes-tickets.firebasestorage.app",
      messagingSenderId: "364717584125",
      appId: "1:364717584125:web:d7099acf6391325c7cd894",
      measurementId: "G-DW1WGEE9FS"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .catch(error => console.error('Erro na persistência:', error));

    let currentUser = null;
    let todosUsuarios = [];

    // ===== TOAST =====
    function toast(msg, ok = true) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const el = document.createElement('div');
      el.className = 'toast ' + (ok ? 'ok' : 'err');
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    // ===== CONFIRMAÇÃO =====
    function confirmar(msg) {
      return new Promise(resolve => {
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:10000;display:flex;align-items:center;justify-content:center;';
        const box = document.createElement('div');
        box.style.cssText = 'background:var(--bg);border-radius:12px;padding:1.5rem;max-width:360px;width:90%;box-shadow:0 8px 30px rgba(0,0,0,0.3);';
        box.innerHTML = `
          <p style="margin:0 0 1.25rem;font-size:0.95rem;line-height:1.5;">${msg}</p>
          <div style="display:flex;gap:0.75rem;justify-content:flex-end;">
            <button id="conf-nao" class="btn">Cancelar</button>
            <button id="conf-sim" class="btn btn--accent">Confirmar</button>
          </div>
        `;
        overlay.appendChild(box);
        document.body.appendChild(overlay);
        box.querySelector('#conf-sim').onclick = () => { overlay.remove(); resolve(true); };
        box.querySelector('#conf-nao').onclick = () => { overlay.remove(); resolve(false); };
        overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); resolve(false); } };
      });
    }

    auth.onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = './index.html'; return; }
      try {
        const doc = await db.collection('users').doc(user.uid).get();
        if (!doc.exists) { auth.signOut(); window.location.href = './index.html'; return; }

        currentUser = { uid: user.uid, ...doc.data() };
        localStorage.setItem('userType', currentUser.tipo);

        if (currentUser.tipo !== 'super_admin') {
          toast('Acesso negado. Apenas super admins.', false);
          setTimeout(() => window.location.href = './portal.html', 1500);
          return;
        }

        const logoutBtnNav = document.getElementById('logout-btn-nav');
        const logoutBtnMenu = document.getElementById('logout-btn-menu');
        if (logoutBtnNav) logoutBtnNav.style.display = 'inline-block';
        if (logoutBtnMenu) logoutBtnMenu.style.display = 'inline-block';

        const userProfile = document.getElementById('user-profile');
        const userNameSpan = document.getElementById('user-name');
        const userEmailSpan = document.getElementById('user-email');
        if (userProfile && userNameSpan && userEmailSpan) {
          userNameSpan.textContent = currentUser.nome || 'Usuário';
          userEmailSpan.textContent = currentUser.email || '';
          userProfile.style.display = 'flex';
        }

        carregarUsuarios();
      } catch (error) {
        console.error('Erro ao carregar perfil:', error);
        window.location.href = './index.html';
      }
    });

    async function carregarUsuarios() {
      try {
        const snapshot = await db.collection('users').get();
        todosUsuarios = [];
        snapshot.forEach(doc => todosUsuarios.push({ id: doc.id, ...doc.data() }));
        todosUsuarios.sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
        renderUsers(todosUsuarios);
      } catch (e) {
        toast('Erro ao carregar usuários: ' + e.message, false);
      }
    }

    function renderUsers(users) {
      const container = document.getElementById('users-list');
      const empty = document.getElementById('users-empty');
      const count = document.getElementById('users-count');
      container.innerHTML = '';

      if (!users.length) { empty.hidden = false; count.textContent = ''; return; }
      empty.hidden = true;
      count.textContent = `${users.length} usuário(s) encontrado(s)`;

      users.forEach(user => {
        const isSelf = user.id === currentUser.uid;
        const tipo = user.tipo || 'comum';

        const card = document.createElement('div');
        card.className = 'info-card user-card';
        card.innerHTML = `
          <div class="user-card-header">
            <span class="user-nome">${user.nome || 'Sem nome'} ${isSelf ? '<span class="self-tag">(você)</span>' : ''}</span>
            <span class="badge badge--${tipo.replace('_','')}">${tipo === 'super_admin' ? 'superadmin' : tipo}</span>
          </div>
          <div class="user-email">${user.email || '—'}</div>
          <div class="user-actions" id="actions-${user.id}">
            ${isSelf ? '<span style="font-size:0.82rem;opacity:0.6;">Não é possível alterar seu próprio perfil.</span>' : `
              <button class="btn btn--sm" onclick="promover('${user.id}','comum')" ${tipo === 'comum' ? 'disabled' : ''}>
                Comum
              </button>
              <button class="btn btn--sm" onclick="promover('${user.id}','admin')" ${tipo === 'admin' ? 'disabled' : ''}>
                Admin
              </button>
              <button class="btn btn--sm" onclick="promover('${user.id}','super_admin')" ${tipo === 'super_admin' ? 'disabled' : ''}>
                Super Admin
              </button>
            `}
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.promover = async (uid, novoTipo) => {
      const usuario = todosUsuarios.find(u => u.id === uid);
      if (!usuario) return;
      const tipoLabel = novoTipo === 'super_admin' ? 'Super Admin' : novoTipo === 'admin' ? 'Admin' : 'Comum';
      const ok = await confirmar(`Promover <strong>${usuario.nome || 'este usuário'}</strong> para <strong>${tipoLabel}</strong>?`);
      if (!ok) return;

      // Desabilitar botões durante a operação
      const actions = document.getElementById(`actions-${uid}`);
      if (actions) actions.querySelectorAll('button').forEach(b => b.disabled = true);

      try {
        await db.collection('users').doc(uid).update({ tipo: novoTipo });

        // Sincronizar com Google Sheets
        const apiUrl = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
          ? 'http://localhost:3000'
          : 'https://portal-inscricoes.onrender.com';
        await fetch(`${apiUrl}/operadores/${uid}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tipo: novoTipo })
        }).catch(e => console.warn('Aviso: falha ao sincronizar com Sheets:', e));

        toast(`${usuario.nome || 'Usuário'} promovido para ${tipoLabel}!`);
        await carregarUsuarios();
      } catch (error) {
        toast('Erro: ' + error.message, false);
        if (actions) actions.querySelectorAll('button').forEach(b => b.disabled = false);
      }
    };

    // Busca em tempo real
    document.addEventListener('DOMContentLoaded', () => {
      const busca = document.getElementById('busca-usuarios');
      if (busca) {
        busca.addEventListener('input', () => {
          const q = busca.value.trim().toLowerCase();
          if (!q) { renderUsers(todosUsuarios); return; }
          const filtrados = todosUsuarios.filter(u =>
            (u.nome || '').toLowerCase().includes(q) ||
            (u.email || '').toLowerCase().includes(q)
          );
          renderUsers(filtrados);
        });
      }
    });

    window.logout = () => {
      auth.signOut().then(() => window.location.href = './index.html');
    };
  </script>
